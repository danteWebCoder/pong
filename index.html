<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>

<body class="centered">
    <div class="gameContainer max columnCentered">
        <div class="topBox">
            <div class="counterBox max">
                <span id="counterLeft" class="counter">0</span>
            </div>
            <div class="lineSeparator"></div>
            <div class="counterBox max">
                <span id="counterRight" class="counter">0</span>
            </div>
        </div>

        <div class="gameBox max relative centered">
            <div id="gameField" class="gameField max relative">
                <div id="barLeft" class="bar leftBar absolute invisible tempo300"></div>
                <div id="barRight" class="bar rightBar absolute invisible tempo300"></div>
                <div id="fieldSeparator" class="fieldSeparator absolute invisible tempo300"></div>
                <div id="ball" class="ball absolute invisible tempo300"></div>
            </div>

            <div id="selectionBox" class="selectionBox selectionBox_contracted absolute hidden invisible tempo600">
                <div id="selectorLeft" class="sideSelector selectorLeft gameText centered">LEFT</div>
                <div id="selectorRight" class="sideSelector selectorRight gameText centered">RIGHT</div>
            </div>

            <div id="countDownBox" class="countDownBox centered absolute hidden"></div>

        </div>
    </div>



    <script type="module" src="control2.js"></script>
</body>

</html>
