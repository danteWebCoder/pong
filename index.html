<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mainContainer max">
        <div class="topBox">
            <div class="counterBox max">
                <div class="counter">10</div>
            </div>
            <div class="lineSeparator"></div>
            <div class="counterBox max">
                <div class="counter">20</div>
            </div>
        </div>
        <div class="gameContainer centered">
            <div id="gameBox" class="gameBox max relative centered">
                <div class="gameLineSeparator absolute"></div>
                <div id="barLeft" class="bar leftBar absolute invisible tempo300"></div>
                <div id="barRight" class="bar rightBar absolute invisible tempo300"></div>
                <div id="ball" class="ball absolute invisible tempo300"></div>

                <div class="sideSelectorsBox tempo600">
                    <div id="sideLeft" class="sideBox gameText centered relative">LEFT <input class="hiddenSelector"
                            type="radio" name="sideSelector" id="sideSelectorLeft"></div>
                    <div id="sideLeft" class="sideBox gameText centered relative">RIGHT <input class="hiddenSelector"
                            type="radio" name="sideSelector" id="sideSelectorRight"></div>
                </div>
                <div class="pressSpace gameText absolute centered tempo300 invisible hidden">
                    <div class="spaceText tempo300">SPACE</div></div>
            </div>
        </div>
    </div>

    <script type="module" src="control.js"></script>
</body>

</html>
