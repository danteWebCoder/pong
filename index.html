<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
</head>

<body class="centered">
    <div class="gameContainer max columnCentered">

        <div class="gameBox max relative rowSpace">
            <div id="field" class="field relative centered">

                <div id="topBar" class="interfaceBar topBar topBar_boxOut rowSpace absolute tempo300">
                    <div class="countersBox rowSpace">
                        <div class="sideCounter rowSpace">
                            <ul class="itemsBox"></ul>
                            <span id="counterLeft" class="counter counterLeft">0</span>
                        </div>
                        <div class="sideCounter rowSpace">
                            <span id="counterRight" class="counter counterRight">0</span>
                            <ul class="itemsBox"></ul>
                        </div>
                    </div>
                </div>

                <div id="bottomBar" class="interfaceBar centered bottomBar bottomBar_boxOut absolute tempo300">
                    <div class="balancePointerBox relative"><span class="balancePointer"></span></div>
                </div>

                <div id="leftBar" class="bar leftBar absolute invisible tempo300"></div>
                <div id="rightBar" class="bar rightBar absolute invisible tempo300"></div>
                <div id="fieldLine" class="fieldLine absolute invisible tempo300"></div>
                <div id="ball" class="ball absolute invisible tempo300"></div>
                <!--  -->
                <div id="selectionBox" class="selectionBox selectionBox_contracted rowSpace tempo600 invisible hidden">
                    <div id="selectorLeft" class="sideSelector buttonBox centered" data-text="LEFT"
                        style="--glow: var(--enphasis1)"></div>
                    <div id="selectorRight" class="sideSelector buttonBox centered" data-text="RIGHT"
                        style="--glow: var(--enphasis1)"></div>
                </div>
                <div id="countDownBox" class="countDownBox centered absolute hidden"></div>

                <div id="newGame" class="buttonBox buttonBox_active centered absolute tempo300" data-text="NEW"
                    style="--glow: var(--enphasis2)"></div>


            </div>
            <ul id="terminal" class="terminalInfoBox"></ul>
        </div>
    </div>



    <script type="module" src="control3.js"></script>
</body>

</html>
