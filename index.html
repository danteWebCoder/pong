<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mainContainer max">
        <div class="topBox">
            <div class="counterBox max">
                <div class="counter">10</div>
            </div>
            <div class="lineSeparator"></div>
            <div class="counterBox max">
                <div class="counter">20</div>
            </div>
        </div>
        <div id="gameBox" class="gameBox relative centered">
            <div class="gameLineSeparator absolute"></div>
            <div id="barLeft" class="bar leftBar absolute hidden invisible"></div>
            <div id="barRight" class="bar rightBar absolute hidden invisible"></div>
            <div id="ball" class="ball absolute hidden invisible"></div>

            <div class="selectionBox">
                <div class="sideBox centered">LEFT</div>
                <div class="sideBox centered">RIGHT</div>
            </div>
        </div>
    </div>

    <script type="module" src="control.js"></script>
</body>

</html>
